[pytest]
testpaths = tests
# The slow tests load models (sentence transformers, the cross-encoder, the surprisal LM)
# or read the thesis data; run them with:  python -m pytest -m slow
addopts = -m "not slow" -p no:cacheprovider
markers =
    slow: loads models or large files; deselected by default
filterwarnings =
    error::RuntimeWarning:asyncio
    ignore::DeprecationWarning:dspy.*
